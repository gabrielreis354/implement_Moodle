# Workflow: Terraform Plan
#
# Executa fmt, validate e plan do Terraform em cada Pull Request para main
# e sob demanda via workflow_dispatch.
#
# SECRETS NECESSARIOS (GitHub → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — Access Key ID das credenciais temporarias do Learner Lab
#   AWS_SECRET_ACCESS_KEY  — Secret Access Key das credenciais temporarias do Learner Lab
#   AWS_SESSION_TOKEN      — Session Token obrigatorio no Learner Lab (credenciais STS)
#
# ⚠️  As credenciais do AWS Academy Learner Lab expiram em ~4 horas.
#     Atualize os tres secrets ANTES de cada execucao, copiando os valores
#     em AWS Details → Cloud Access → AWS CLI no portal do Learner Lab.
#
# TODO: (producao) Substituir as credenciais estaticas de longa duracao por
#       OIDC com IAM Role (aws-actions/configure-aws-credentials com role-to-assume)
#       e migrar o state para um backend remoto S3 + DynamoDB com locking.

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Valores ficticios usados SOMENTE para validacao do plan em CI.
    # Nenhuma infra real e provisionada neste workflow; nao use esses
    # valores em terraform apply.
    env:
      TF_VAR_ssh_allowed_cidr: "203.0.113.10/32"
      TF_VAR_db_password: "CiPlanOnly123"
      TF_VAR_moodle_admin_password: "CiPlan@Only123"

    defaults:
      run:
        working-directory: terraform

    steps:
      # Faz o checkout do repositorio para que o runner acesse os arquivos Terraform
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Injeta as credenciais temporarias do Learner Lab no ambiente do runner.
      # aws-session-token e obrigatorio porque o Lab usa credenciais STS efemeras.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Instala o Terraform CLI na versao fixada; terraform_wrapper=false evita
      # que o wrapper intercepte o exit code do plan (necessario para o step de falha).
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Inicializa o backend local e baixa o provider AWS (~> 5.0)
      - name: Terraform Init
        run: terraform init -input=false

      # Verifica se todos os arquivos .tf estao formatados conforme o padrao HashiCorp
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Valida a sintaxe e consistencia interna da configuracao Terraform
      - name: Terraform Validate
        run: terraform validate

      # Gera o plano e salva em plan.txt; continue-on-error permite capturar falha
      # no step seguinte sem cancelar o job imediatamente
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false 2>&1 | tee plan.txt

      # Publica o resultado do plan como comentario no PR para revisao.
      # Executado somente em pull_request; always() garante execucao mesmo se
      # o plan falhou (continue-on-error nao impede o if).
      - name: Comentar resultado do plan no PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // defaults.run.working-directory vale so para steps "run:"; este step "uses:"
            // executa na raiz do workspace, entao o plan.txt esta em terraform/plan.txt.
            // Se um step anterior falhou antes do plan, o arquivo nao existe.
            const planFile = 'terraform/plan.txt';
            const raw = fs.existsSync(planFile)
              ? fs.readFileSync(planFile, 'utf8')
              : 'O plan nao foi executado (um step anterior falhou). Veja os logs do job.';
            // Trunca para 60000 caracteres para nao exceder o limite do comentario do GitHub
            const output = raw.length > 60000 ? raw.slice(0, 60000) + '\n... [truncado]' : raw;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅ Sucesso' : '❌ Falha';
            const body = [
              '## Terraform Plan',
              '',
              `**Status:** ${status}`,
              '',
              '<details><summary>Expandir output</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Falha o job se o plan retornou erro, garantindo que o PR nao seja mergeado
      # com uma configuracao Terraform invalida
      - name: Falhar o job se o plan falhou
        if: steps.plan.outcome == 'failure'
        run: exit 1