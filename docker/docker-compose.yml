# =============================================================================
# Docker Compose — Ambiente local Moodle 4.x + PostgreSQL 15
# =============================================================================
# Pré-requisitos: Docker Engine >= 24 e Docker Compose v2
# Uso:
#   cp docker/.env.example docker/.env   # configure as variáveis de ambiente
#   docker compose -f docker/docker-compose.yml up -d
# Acesso: http://localhost:8080
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Serviço: db — Banco de dados PostgreSQL 15
  # TODO: Ajuste a versão da imagem ou parâmetros de memória conforme necessário
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15
    restart: unless-stopped

    # Carrega as variáveis do .env real (copiado de .env.example e fora do Git).
    # Corrigido: antes lia o .env.example, ignorando as senhas do aluno.
    # TODO: Em produção, use um gerenciador de segredos (ex.: AWS Secrets Manager)
    env_file:
      - .env

    # Healthcheck: aguarda o PostgreSQL aceitar conexões antes de liberar o Moodle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    volumes:
      # TODO: Ajuste o caminho do volume ou use um bind mount externo se necessário
      - db_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Serviço: moodle — Aplicação Moodle 4.x (build a partir do Dockerfile local)
  # TODO: Ajuste as variáveis de ambiente ou adicione configurações extras aqui
  # ---------------------------------------------------------------------------
  moodle:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    # Aguarda o PostgreSQL estar saudável antes de iniciar o Moodle
    depends_on:
      db:
        condition: service_healthy

    # Porta do host configurável via MOODLE_HOST_PORT (padrão 8080). Em máquinas onde o
    # Windows reserva a 8080, defina MOODLE_HOST_PORT e MOODLE_WWWROOT no .env (devem coincidir).
    # TODO: Em produção, publicar a porta 80 atrás de um proxy/ALB com HTTPS
    ports:
      - "${MOODLE_HOST_PORT:-8080}:80"

    # Carrega as variáveis do .env real (mesma fonte do serviço db)
    env_file:
      - .env

    # Passa as variáveis de conexão ao banco e de instalação ao contêiner Moodle.
    # O entrypoint (entrypoint.sh) usa estas variáveis para instalar o Moodle
    # automaticamente na primeira execução (gera o config.php).
    environment:
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
      - MOODLE_EMAIL=${MOODLE_EMAIL}
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=${MOODLE_DATABASE_HOST}
      - MOODLE_DATABASE_PORT_NUMBER=${MOODLE_DATABASE_PORT_NUMBER}
      - MOODLE_DATABASE_NAME=${MOODLE_DATABASE_NAME}
      - MOODLE_DATABASE_USER=${MOODLE_DATABASE_USER}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DATABASE_PASSWORD}
      - MOODLE_USERNAME=${MOODLE_USERNAME}
      - MOODLE_PASSWORD=${MOODLE_PASSWORD}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}

    volumes:
      # Corrigido: os nomes estavam trocados (moodle_data montava o código).
      # moodle_www = código (DocumentRoot); moodle_data = dados (moodledata).
      # TODO: Ajuste os caminhos de montagem dos volumes caso necessário
      - moodle_www:/var/www/html
      - moodle_data:/var/moodledata

# =============================================================================
# Volumes nomeados
# TODO: Para persistência externa, substitua por bind mounts ou drivers de volume
# =============================================================================
volumes:
  db_data:
  moodle_data:
  moodle_www:
